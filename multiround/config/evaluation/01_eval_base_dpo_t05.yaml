# Evaluation config for comparing base gRNAde with DPO checkpoints
# Temperature 0.5, 8 samples per structure, with Amber relaxation
# Usage: python multiround/eval_checkpoints.py --config multiround/config/evaluation/01_eval_base_dpo_t05.yaml

seed: 42
device: cuda

paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt    
  split_name: test
  
  # Extensible checkpoint list - add more as needed (up to 10)
  checkpoints:
    # - name: "BASE"
    #   path: checkpoints/gRNAde_ARv1_1state_das.h5
    - name: "DPO_v3_s16k"  # Concise names
      path: runs/offline_dpo/dpo_rna_v3/steps/step_0016300.pt
    - name: "DPO_v5_best"
      path: runs/offline_dpo/dpo_rna_v5/best.pt
    # # # Add more checkpoints as needed:
    # - name: "DPO_v6_best"
    #   path: runs/offline_dpo/dpo_rna_v6/best.pt

featurizer:
  split: test
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.0
  distance_eps: 0.001
  device: cpu

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim: [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim: [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

eval:
  batch_size: 16
  num_workers: 6
  pin_memory: true
  
  # Limit structures for quick testing
  max_structures: null
  
  # Output to organized directory structure
  out_dir: multiround/eval_multiround/02_2dpo_t05
  
  # Sampling parameters
  n_samples: 8                   # 8 samples per structure for robust statistics
  temperature: 0.5               # Moderate temperature for diverse but reasonable sampling
  
  # Structure optimization options
  use_relax: false                # Enable Amber relaxation for dual clash scores (pre/post)
 
  use_lddt: true                 # Enable lDDT calculation for structure accuracy
  use_msa: false                 # No MSA for faster evaluation (can enable for production)
  
  # Comprehensive metrics using eval_full.py
  metrics:
    - recovery                   # Sequence recovery (teacher-forced)
    - perplexity                # Model confidence  
    - sc_eternafold             # 2D self-consistency with EternaFold
    - sc_rhofold                # 3D self-consistency (RMSD, TM, GDT, pLDDT, INF, clash, lDDT, MCQ)
    - sc_vienna                 # Thermodynamics (MFE, ED, entropy, pS0, diversity, Tm)
    - diversity_3mer            # 3-mer correlation diversity analysis
  
  # Save designs in same directory as metrics
  save_designs: true
  
  # W&B logging
  wandb:
    enable: true
    project: RiboPO-Multiround
    entity: <wandb-entity>
    run_name: eval_02_2dpo_t05       # Concise run name
    tags: ["evaluation", "base_vs_dpo", "t0.5", "relax"]
    notes: "Base gRNAde vs DPO checkpoints at T=0.5 with Amber relaxation"