# PRODUCTION EVALUATION TEMPLATE
# Comprehensive evaluation config with all 29 metrics + pass@k analysis
# 
# USAGE:
#   python -m dpo.bench.eval_full --config multiround/config/evaluation/eval_run/00_debug_comprehensive.yaml
#
# MODIFY THESE FOR EACH EVALUATION:
#   1. eval.out_dir - Change to your experiment name  
#   2. paths.checkpoints - Add your trained checkpoints
#   3. paths.small_dataset - true for testing (17 structs), false for full (98 structs)
#   4. eval.passk.enable - true for pass@k analysis (slower), false for quick eval

seed: 42
device: cuda

paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  split_name: test
  small_dataset: false            # CHANGE: true=17 structures (quick), false=98 structures (full)

  # MODIFY: Add your checkpoints here
  checkpoints:
    - name: "BASE_gRNAde_1state_das_temp0.1_samp1"
      path: checkpoints/gRNAde_ARv1_1state_das.h5
    # EXAMPLES: Add your trained checkpoints
    # - name: "exp21_dpo_round1_best"
    #   path: multiround/runs/21_no_ref_dpo_0.13_dynamic_10e/round_01/best.pt
    # - name: "exp21_dpo_round3_best"  
    #   path: multiround/runs/21_no_ref_dpo_0.13_dynamic_10e/round_03/best.pt
    # - name: "exp21_dpo_final"
    #   path: multiround/runs/21_no_ref_dpo_0.13_dynamic_10e/round_05/final.pt


featurizer:
  split: test
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.0
  distance_eps: 0.001
  device: cpu

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim: [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim: [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

eval:
  batch_size: 24
  num_workers: 6
  pin_memory: true
  
  # MODIFY: Change output directory for each evaluation
  out_dir: multiround/eval_multiround/00_debug_comprehensive/
  
  n_samples: 8                   # OPTIONAL: 8-64 samples (higher=better statistics)
  temperature: 0.1               # OPTIONAL: 0.1=deterministic, 0.5=diverse
  use_relax: false               # OPTIONAL: true for clash score analysis (slower)
  use_lddt: true                 # OPTIONAL: false to skip lDDT calculation (faster)

  # Complete 29-metric evaluation suite
  metrics:
    - recovery                  # sequence recovery (teacher-forced)
    - perplexity               # model confidence
    - sc_eternafold            # 2D self-consistency with EternaFold
    - sc_rhofold               # 3D self-consistency with RhoFold (RMSD, TM, GDT, pLDDT, INF, clash, lDDT, MCQ)
    - vienna_mfe               # Vienna thermodynamics - Minimum Free Energy
    - vienna_ED                # Vienna thermodynamics - Ensemble Defect (+ Shannon entropy)
    - diversity_3mer           # 3-mer correlation diversity

  save_designs: true

  # Pass@k analysis configuration
  passk:
    enable: false                        # CHANGE: true for pass@k analysis (slower)
    k_values: [1, 2, 4, 8, 16, 32, 64]  # k values for pass@k analysis
    n_samples_passk: 64                  # samples for pass@k (64=comprehensive, 8=quick)
    
    # Success thresholds for pass@k analysis
    thresholds:
      tm_score: [0.4, 0.45, 0.5, 0.55]   # TM-score thresholds (higher=better)
      rmsd: [8.0, 6.0, 4.0, 2.0]         # RMSD thresholds Å (lower=better)  
      mfe: [-10.0, -15.0, -20.0]         # MFE thresholds kcal/mol (lower=better)
    
    # Analysis options
    collect_individual_metrics: true     # Save per-sample metrics
    plot_distributions: true            # Generate distribution plots
    plot_metrics: ["plddt", "rmsd", "tm_score", "mfe", "inf_all"]
    save_passk_results: true            # Save detailed JSON results
    passk_output_dir: "passk_analysis"  # Subdirectory for pass@k outputs

  wandb:
    enable: true
    project: DPO-RNA
    entity: minghao-sun-soc