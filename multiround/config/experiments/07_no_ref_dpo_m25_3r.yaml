# 07. DPO without Reference Update - Margin 25, 3 Rounds
# Tests effect of reference model updating vs keeping original reference

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 07_no_ref_dpo_m25_3r
  mode: online
  tags: ["07_no_ref", "margin25", "3_rounds", "ablation"]
  notes: "DPO without reference updates - tests reference update importance"
  group: "ablation_experiments"

multiround:
  num_rounds: 3                # Shorter 3-round experiment
  epochs_per_round: 5          # 5 epochs per round for faster testing
  update_reference: false      # Key difference: no reference updates
  eval_temperature: 0.5
  final_eval_temperature: 0.1
  n_samples_eval: 8
  n_samples_final_eval: 64
  save_eval_data: true

# Experiment-specific paths
paths:
  pair_margin: "25"
  save_dir: multiround/runs/07_no_ref_dpo_m25_3r
  # Override default pairs to use margin25
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl

dpo:
  beta: 0.13
  sft_lambda: 0.10
  label_smoothing: 0.0

# Override training epochs to match epochs_per_round
training:
  epochs: 5  # Matched to epochs_per_round

# Override optimizer learning rate  
optimizer:
  lr: 0.00018  # 1.8e-4 optimized for DPO