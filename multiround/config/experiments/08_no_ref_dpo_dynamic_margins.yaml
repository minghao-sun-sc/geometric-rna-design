# 08. DPO without Reference Update - Dynamic Margins
# Tests dynamic margins without reference model updates

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 08_no_ref_dpo_dynamic_m25_m125
  mode: online
  tags: ["08_no_ref", "dynamic_margins", "ablation"]
  notes: "Dynamic margins (R1-R2: margin25, R3-R5: margin125) without reference updates"
  group: "ablation_experiments"

multiround:
  num_rounds: 5
  epochs_per_round: 20
  update_reference: false      # Key difference: no reference updates
  eval_temperature: 0.5
  final_eval_temperature: 0.1
  n_samples_eval: 8
  n_samples_final_eval: 64
  save_eval_data: true
  
  # Dynamic preference pair switching (same as config 11)
  dynamic_pairs: true
  pair_configs:
    # Rounds 1-2: use margin25 (easier/more diverse pairs)
    rounds_1_2: 
      margin_type: "25"
      description: "Margin 25 for initial rounds"
      pairs:
        train: data/pairs_margin25/by_das/clean/train.clean.jsonl
        val: data/pairs_margin25/by_das/clean/val.clean.jsonl
        test: data/pairs_margin25/by_das/clean/test.clean.jsonl
    # Rounds 3-5: use margin125 (harder/more selective pairs)  
    rounds_3_5:
      margin_type: "125"
      description: "Margin 125 for later rounds"
      pairs:
        train: data/pairs_margin125/by_das/clean/train.clean.jsonl
        val: data/pairs_margin125/by_das/clean/val.clean.jsonl
        test: data/pairs_margin125/by_das/clean/test.clean.jsonl

# Experiment-specific paths
paths:
  pair_margin: "25"  # Starting margin
  save_dir: multiround/runs/08_no_ref_dpo_dynamic_margins
  # Override default pairs to use margin25 initially
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl

dpo:
  beta: 0.13
  sft_lambda: 0.10
  label_smoothing: 0.0

# Override training epochs to match epochs_per_round
training:
  epochs: 20  # Matched to epochs_per_round

# Override optimizer learning rate  
optimizer:
  lr: 0.00018  # 1.8e-4 optimized for DPO

# Data validation and fallback settings
validation:
  check_pair_files: true
  fallback_to_static: true
  static_fallback_margin: "125"
  enable_data_validation: true