# 00. DEBUG A40 - Optimized for NVIDIA A40 48GB GPU
# Full evaluation metrics with GPU-specific optimization

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 00_debug_a40
  mode: online
  tags: ["00_debug", "a40", "gpu_optimized", "full_eval"]
  notes: "DEBUG: Optimized for A40 48GB with full evaluation metrics"
  group: "debug_experiments"

multiround:
  num_rounds: 2                 # 2 rounds for testing round transition
  epochs_per_round: 2           # As requested - 2 epochs per round
  update_reference: true        
  eval_temperature: 0.5
  final_eval_temperature: 0.1   
  n_samples_eval: 8              # Standard samples for evaluation
  n_samples_final_eval: 64        # Full 64 samples for proper pass@k
  save_eval_data: true
  
  # Dynamic pairs config
  dynamic_pairs: true
  pair_configs:
    rounds_1_2: 
      margin_type: "25"
      description: "Margin 25 for debug rounds"
      pairs:
        train: data/pairs_margin25/by_das/clean/train.clean.jsonl
        val: data/pairs_margin25/by_das/clean/val.clean.jsonl
        test: data/pairs_margin25/by_das/clean/test.clean.jsonl

paths:
  pair_margin: "25"
  save_dir: multiround/runs/00_debug_a40
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  base_checkpoint: checkpoints/gRNAde_ARv1_1state_das.h5
  
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl
  
  pairs_margin25:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl
  pairs_margin125:
    train: data/pairs_margin125/by_das/clean/train.clean.jsonl
    val: data/pairs_margin125/by_das/clean/val.clean.jsonl
    test: data/pairs_margin125/by_das/clean/test.clean.jsonl

dpo:
  beta: 0.13
  sft_lambda: 0.10
  label_smoothing: 0.0
  max_len: 512

# A40 48GB OPTIMIZATION (more conservative than A100)
training:
  epochs: 2                     # Matched to epochs_per_round
  batch_size: 32                # Smaller than A100 due to 48GB vs 80GB memory
  grad_accum_steps: 2           # Effective batch = 72 (slightly larger than original)
  num_workers: 6                # Safe for 8 CPU cores
  precision: bf16               # A40 supports bf16 (Ampere architecture)
  pin_memory: false             # Keep false as requested
  drop_last: false              
  log_every: 10                 # Reduced logging frequency
  save_every: 300               # As requested
  val_every: 300                # As requested
  keep_last_n: 5                
  compile: false                # Disabled due to NetworkX conflicts
  
  # Additional optimizations
  prefetch_factor: 2            # Standard prefetching
  persistent_workers: true      # Keep workers alive

# Full evaluation with optimization
eval:
  batch_size: 24                # Matched to training batch size
  num_workers: 6                
  pin_memory: false
  
  n_samples: 8                  
  temperature: 0.5
  
  use_relax: false              # Keep false for speed
  use_lddt: true                # Full metrics as requested
  
  # FULL METRICS as requested
  metrics:
    - recovery                  
    - perplexity               
    - sc_eternafold            
    - sc_rhofold               # Included as requested
    - vienna_mfe                # Included as requested
    - vienna_ED                 # Included as requested
    - diversity_3mer            # Included as requested
  
  save_designs: true            # Full evaluation

# Full pass@k analysis as requested
evaluation:
  pass_k:
    k_values: [1, 2, 4, 8, 16, 32, 64]  # Full k values
    thresholds:
      tm_score: [0.4, 0.45, 0.5, 0.55]   # Full thresholds
      rmsd: [8.0, 6.0, 4.0, 2.0]         # Full thresholds
      mfe: [-10.0, -15.0, -20.0]         # Full thresholds
  
  plot_distributions: true
  plot_round_progression: true
  save_sample_sequences: true

featurizer:
  split: train
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.1
  distance_eps: 0.001
  device: cuda                 # Use GPU for featurizer

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim: [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim: [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

optimizer:
  lr: 0.00018
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip_norm: 1.0

scheduler:
  name: cosine
  warmup_steps: 100
  min_lr_ratio: 0.1

validation:
  check_pair_files: true
  fallback_to_static: true
  static_fallback_margin: "125"
  enable_data_validation: true

# Commands:
# python -m multiround.train --config multiround/config/experiments/00_debug_a40.yaml