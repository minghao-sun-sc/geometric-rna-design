# 10. DPO without Reference Update - Margin 125
# Tests margin125 (stricter preferences) without reference model updates

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 10_no_ref_dpo_m125_5r
  mode: online
  tags: ["10_no_ref", "margin125", "5_rounds", "ablation"]
  notes: "DPO margin125 without reference updates - full 5 rounds"
  group: "ablation_experiments"

multiround:
  num_rounds: 5
  epochs_per_round: 20
  update_reference: false      # Key difference: no reference updates
  eval_temperature: 0.5
  final_eval_temperature: 0.1
  n_samples_eval: 8
  n_samples_final_eval: 64
  save_eval_data: true

# Experiment-specific paths
paths:
  pair_margin: "125"           # Using stricter margin125 preferences
  save_dir: multiround/runs/10_no_ref_dpo_m125
  # Use default margin125 pairs (already set in defaults)

dpo:
  beta: 0.13
  sft_lambda: 0.10
  label_smoothing: 0.0

# Override training epochs to match epochs_per_round
training:
  epochs: 20  # Matched to epochs_per_round

# Override optimizer learning rate  
optimizer:
  lr: 0.00018  # 1.8e-4 optimized for DPO