# 00. DEBUG A40 - VERIFIED Configuration  
# Full evaluation metrics with GPU-specific optimization
# Fixed and validated for multiround training

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 00_debug_a40
  mode: online
  tags: ["00_debug", "a40", "gpu_optimized", "full_eval", "verified"]
  notes: "DEBUG: Optimized for A40 48GB with full evaluation metrics - VERIFIED"
  group: "debug_experiments"

multiround:
  num_rounds: 2                 # 2 rounds for testing round transition
  epochs_per_round: 2           # 2 epochs per round for quick debug
  update_reference: true        # Enable reference model updates between rounds
  eval_temperature: 0.5         # Standard evaluation temperature
  final_eval_temperature: 0.1   # Lower temperature for final evaluation
  n_samples_eval: 8              # Standard samples for evaluation
  n_samples_final_eval: 64      # Full 64 samples for proper pass@k
  save_eval_data: true
  
  # OPTIONAL: Skip pass@k on round 1 to save time (uncomment to enable)
  # skip_intermediate_passk: true  # Only do pass@k on final round (saves ~20 min/round)
  
  # Dynamic pairs config - using margin 25 for both rounds in debug
  dynamic_pairs: true
  pair_configs:
    rounds_1_2: 
      margin_type: "25"
      description: "Margin 25 for debug rounds"
      pairs:
        train: data/pairs_margin25/by_das/clean/train.clean.jsonl
        val: data/pairs_margin25/by_das/clean/val.clean.jsonl
        test: data/pairs_margin25/by_das/clean/test.clean.jsonl

paths:
  pair_margin: "25"
  save_dir: multiround/runs/00_debug_a40
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  base_checkpoint: checkpoints/gRNAde_ARv1_1state_das.h5
  
  # Primary pairs for initial loading
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl
  
  # Backup configurations for fallback
  pairs_margin25:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl
  pairs_margin125:
    train: data/pairs_margin125/by_das/clean/train.clean.jsonl
    val: data/pairs_margin125/by_das/clean/val.clean.jsonl
    test: data/pairs_margin125/by_das/clean/test.clean.jsonl

dpo:
  beta: 0.13                    # DPO beta parameter
  sft_lambda: 0.10              # SFT regularization weight
  label_smoothing: 0.0          # No label smoothing
  max_len: 512                  # Maximum sequence length

# A40 48GB OPTIMIZATION (more conservative than A100)
training:
  epochs: 2                     # Matched to epochs_per_round
  batch_size: 32                # Smaller batch for A40 48GB (vs 32 for A100)
  grad_accum_steps: 2           # Effective batch = 72 (slightly larger than A100's 64)
  num_workers: 6                # Optimized for typical CPU count
  precision: bf16               # A40 supports bf16 (Ampere architecture)
  pin_memory: false             # Keep false to avoid issues
  drop_last: false              
  log_every: 1                 # Log every 10 steps
  save_every: 200               # Save checkpoint every 300 steps
  val_every: 200                # Validate every 300 steps
  keep_last_n: 5                # Keep last 5 checkpoints
  compile: false                # Disabled due to NetworkX conflicts
  
  # Additional optimizations
  prefetch_factor: 2            # Standard prefetching
  persistent_workers: true      # Keep workers alive between batches

# Full evaluation with optimization (adjusted for A40 memory)
eval:
  batch_size: 24                # Match training batch size for consistency
  num_workers: 6                
  pin_memory: false
  
  n_samples: 8                  # Samples per structure during eval
  temperature: 0.5              # Evaluation temperature
  
  use_relax: false              # No structure relaxation for speed
  use_lddt: true                # Enable lDDT metric
  
  # FULL METRICS for comprehensive evaluation
  metrics:
    - recovery                  # Sequence recovery
    - perplexity                # Model perplexity
    - sc_eternafold             # 2D structure consistency (EternaFold)
    - sc_rhofold                # 3D structure consistency (RhoFold)
    - vienna_mfe                # Minimum free energy
    - vienna_ED                 # Ensemble defect
    - diversity_3mer            # 3-mer diversity
  
  save_designs: true            # Save designed sequences

# Full pass@k analysis configuration
evaluation:
  pass_k:
    k_values: [1, 2, 4, 8, 16, 32, 64]  # Full k values for pass@k
    thresholds:
      tm_score: [0.4, 0.45, 0.5, 0.55]   # TM-score thresholds
      rmsd: [8.0, 6.0, 4.0, 2.0]         # RMSD thresholds (Angstroms)
      mfe: [-10.0, -15.0, -20.0]         # MFE thresholds (kcal/mol)
  
  plot_distributions: true      # Enable distribution plots
  plot_round_progression: true  # Enable round progression plots
  save_sample_sequences: true   # Save individual sequences

featurizer:
  split: train
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.1
  distance_eps: 0.001
  device: cuda                 # Use GPU for featurizer

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim: [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim: [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

optimizer:
  lr: 0.00018                   # Learning rate
  weight_decay: 0.01            # Weight decay
  betas: [0.9, 0.999]           # Adam betas
  eps: 1.0e-8                   # Adam epsilon
  grad_clip_norm: 1.0           # Gradient clipping

scheduler:
  name: cosine                  # Cosine annealing scheduler
  warmup_steps: 1000             # Warmup steps
  min_lr_ratio: 0.1             # Minimum LR ratio

validation:
  check_pair_files: true        # Validate pair files exist
  fallback_to_static: true      # Enable fallback mechanism
  static_fallback_margin: "125" # Fallback to margin 125 if needed
  enable_data_validation: true  # Enable data validation checks

# Commands:
# For systems with limited CPU RAM, you may need to set:
# export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256
# python -m multiround.train --config multiround/config/experiments/00_debug_a40_verified.yaml