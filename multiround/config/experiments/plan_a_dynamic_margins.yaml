# multiround/config/experiments/plan_a_dynamic_margins.yaml
# Plan A with dynamic margin strategy: 0.25*std for rounds 1-2, 0.125*std for rounds 3-5

# Inherit from multiround defaults
inherit_from: multiround/config/multiround_defaults.yaml

# Experiment-specific settings
experiment:
  name: "plan_a_dynamic_margins"
  description: "5-round DPO with dynamic margins: 0.25*std (rounds 1-2) → 0.125*std (rounds 3-5)"
  strategy: "dynamic_margins"

# Dynamic preference pairs configuration
multiround:
  # Enable dynamic pair switching
  dynamic_pairs: true
  
  # Round-specific pair configurations
  pair_configs:
    rounds_1_2:
      margin_type: "25"
      description: "Wider margin (0.25*std) for initial rounds"
      pairs:
        train: data/pairs_margin25/by_das/clean/train.clean.jsonl
        val:   data/pairs_margin25/by_das/clean/val.clean.jsonl
        test:  data/pairs_margin25/by_das/clean/test.clean.jsonl
    rounds_3_5:
      margin_type: "125"
      description: "Tighter margin (0.125*std) for later rounds"
      pairs:
        train: data/pairs_margin125/by_das/clean/train.clean.jsonl
        val:   data/pairs_margin125/by_das/clean/val.clean.jsonl
        test:  data/pairs_margin125/by_das/clean/test.clean.jsonl

# Override base paths (will be dynamically set per round)
paths:
  pair_margin: "dynamic"  # Indicates dynamic switching
  pairs:
    train: "DYNAMIC"  # Placeholder - will be set per round
    val:   "DYNAMIC"
    test:  "DYNAMIC"

# DPO parameters (could be adjusted per margin type if needed)
dpo:
  beta: 0.14                         # DPO temperature parameter
  sft_lambda: 0.10                   # SFT regularization weight

# Training configuration
training:
  batch_size: 16                     
  grad_accum_steps: 4                # Effective batch size = 64

# Enhanced WandB configuration with dynamic naming
wandb:
  run_name: multiround_dynamic_margins_v1
  tags: ["multiround", "plan_a", "dynamic_margins", "dpo"]
  notes: "Multi-round DPO with dynamic preference margins - 0.25*std→0.125*std strategy"
  group: "dynamic_margins_experiments"

# Expected performance characteristics
expected:
  rounds_1_2:
    pair_counts:
      train: ~58512                 # From margin25 dataset
      val: ~1132
      test: ~1352
    characteristics: "Wider margins, more pairs, initial policy training"
  rounds_3_5:
    pair_counts:
      train: ~14628                 # From margin125 dataset  
      val: ~283
      test: ~338
    characteristics: "Tighter margins, higher quality pairs, fine-tuning"

# Validation settings
validation:
  check_pair_files: true            # Validate pair files exist before each round
  fallback_to_static: true          # Fallback to single margin if dynamic loading fails
  static_fallback_margin: "125"     # Use margin125 as fallback