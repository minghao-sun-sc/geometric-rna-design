# 03. Multi-Round SimPO with margin125 pairs (β=2.0, γ=0.65, λ=0.01, 5 rounds)
# Direct comparison with DPO using same margin125 pairs

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: simpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 03_simpo_m125_b20_g065
  mode: online
  tags: ["03_simpo", "m125", "5rounds"]
  notes: "Multi-round SimPO (β=2.0, γ=0.65, λ=0.01) with margin125 pairs"
  group: "core_experiments"

multiround:
  num_rounds: 5
  epochs_per_round: 20
  update_reference: false       # Enable reference model updates
  eval_temperature: 0.1
  final_eval_temperature: 0.1
  n_samples_eval: 8
  n_samples_final_eval: 8
  save_eval_data: false

# Experiment-specific paths
paths:
  pair_margin: "125"
  save_dir: multiround/runs/03_simpo_m125
  # Use default margin125 pairs (already set in defaults)

# SimPO-specific parameters
simpo:
  beta: 2.0                    # SimPO beta parameter
  gamma: 0.65                  # SimPO margin parameter
  label_smoothing: 0.0

dpo:
  sft_lambda: 0.01             # SFT regularization for SimPO

# Override training epochs to match epochs_per_round
training:
  epochs: 20  # Matched to epochs_per_round

# Override optimizer learning rate for SimPO
optimizer:
  lr: 0.0004  # Higher learning rate for SimPO (4e-4)


