# 04. Multi-Round DPO with margin25 pairs (β=0.13, λ=0.10, 5 rounds)
# Plan A approach with larger margin for more preference pairs

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: <wandb-entity>
  run_name: 04_dpo_m25_b013_l010
  mode: online
  tags: ["04_dpo", "m25", "plan_a", "5rounds"]
  notes: "Multi-round DPO (β=0.13, λ=0.10) with margin25 pairs (Plan A)"
  group: "core_experiments"

multiround:
  num_rounds: 5
  epochs_per_round: 20
  update_reference: true       # Enable reference model updates
  eval_temperature: 0.5
  final_eval_temperature: 0.1
  n_samples_eval: 8
  n_samples_final_eval: 64
  save_eval_data: true

# Experiment-specific paths
paths:
  pair_margin: "25"
  save_dir: multiround/runs/04_dpo_m25
  # Override default pairs to use margin25
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl

dpo:
  beta: 0.13                   # Standard DPO β
  sft_lambda: 0.10             # Standard SFT regularization
  label_smoothing: 0.0

# Override training epochs to match epochs_per_round
training:
  epochs: 20  # Matched to epochs_per_round

# Override optimizer learning rate  
optimizer:
  lr: 0.00018  # 1.8e-4 optimized for DPO