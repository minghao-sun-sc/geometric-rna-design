# 14. Pure DPO without SFT - Margin 25
# Isolates DPO contribution by removing SFT regularization

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 14_pure_dpo_m25_no_sft
  mode: online
  tags: ["14_pure_dpo", "margin25", "no_sft", "ablation"]
  notes: "Pure DPO without SFT regularization - isolates DPO contribution"
  group: "ablation_experiments"

multiround:
  num_rounds: 5
  epochs_per_round: 20
  update_reference: true
  eval_temperature: 0.5
  final_eval_temperature: 0.1
  n_samples_eval: 8
  n_samples_final_eval: 64
  save_eval_data: true

# Experiment-specific paths
paths:
  pair_margin: "25"
  save_dir: multiround/runs/14_pure_dpo_m25
  # Override default pairs to use margin25
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl

dpo:
  beta: 0.13
  sft_lambda: 0.0             # Key difference: no SFT regularization
  label_smoothing: 0.0

# Override training epochs to match epochs_per_round
training:
  epochs: 20  # Matched to epochs_per_round

# Override optimizer learning rate for DPO
optimizer:
  lr: 0.00018  # 1.8e-4 optimized for DPO