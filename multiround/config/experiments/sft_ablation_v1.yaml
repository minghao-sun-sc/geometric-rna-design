# SFT-only Ablation Study (single round)
# Beta=0 (no DPO loss), lambda=0.10 (SFT only), lr=1.8e-4
# Compare against R1 of DPO+SFT

seed: 42
device: cuda
loss_type: dpo  # Keep dpo but set beta=0

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc     
  run_name: sft_ablation_v1_beta0_lambda0.10_lr1.8e-4
  mode: online
  tags: ["sft_ablation", "beta0", "single_round", "ablation_study"]
  notes: "SFT-only ablation study (beta=0, lambda=0.10) for comparison with DPO+SFT"
  group: "ablation_studies"

# Single round configuration
multiround:
  num_rounds: 1
  total_rounds: 1
  epochs_per_round: 20
  update_reference: false
  eval_temperature: 0.5
  final_eval_temperature: 0.5  # Same as eval since only one round
  n_samples_eval: 8
  n_samples_final_eval: 64
  
  # Save evaluation data for comparison
  save_eval_data: true
  eval_data_dir: multiround/runs/sft_ablation_v1/eval_data
  
  # Pass@k analysis for comparison with multiround
  passk:
    enabled_final_only: true
    k_values: [1, 2, 4, 8, 16, 32, 64]
    tm_threshold: 0.45
    rmsd_threshold: 8.0
    mfe_threshold: null

# Use margin25 pairs (same as multiround comparison)
paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  pair_margin: "25"
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val:   data/pairs_margin25/by_das/clean/val.clean.jsonl
    test:  data/pairs_margin25/by_das/clean/test.clean.jsonl
  base_checkpoint: checkpoints/gRNAde_ARv1_1state_das.h5
  save_dir: multiround/runs/sft_ablation_v1
  external_tools_dir: tools
  project_root: /mnt/rna01/smh/projects/ribopo
  data_root: /mnt/rna01/smh/projects/ribopo/data
  wandb_dir: /mnt/rna01/smh/projects/ribopo

# Same model config as multiround
featurizer:
  split: train
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.1
  distance_eps: 0.001
  device: cpu

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim:  [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim:  [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

# Same optimizer/scheduler as multiround
optimizer:
  name: adamw
  lr: 1.8e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip_norm: 1.0

scheduler:
  name: cosine
  warmup_steps: 1000
  min_lr_ratio: 0.1

training:
  epochs: 20
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 8
  pin_memory: false
  drop_last: false
  compile: false
  precision: bf16
  log_every: 1
  val_every: 50
  save_every: 50
  keep_last_n: 5

# SFT-only configuration: beta=0, lambda=0.10
dpo:
  beta: 0.0                  # No DPO loss (SFT-only)
  sft_lambda: 0.10           # Only SFT loss on winners
  label_smoothing: 0.0
  max_len: null

# Same evaluation as multiround
evaluation:
  metrics: [
    'recovery', 'perplexity', 
    'sc_score_eternafold', 'sc_score_vienna', 'sc_score_rhofold'
  ]
  save_designs: true
  compute_passk_final: true

tools:
  usalign:
    dir_name: USalign
    executable_name: USalign
  eternafold:
    root: /mnt/rna01/smh/projects/ribopo/tools/EternaFold
  x3dna:
    root: /mnt/rna01/smh/projects/ribopo/tools/x3dna-v2.4
    bin:  /mnt/rna01/smh/projects/ribopo/tools/x3dna-v2.4/bin
  molprobity:
    root: /mnt/rna01/smh/projects/ribopo/tools/molprobity