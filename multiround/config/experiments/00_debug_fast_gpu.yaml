# 00. FAST DEBUG - Optimized for A100 GPU and rapid iteration
# Ultra-fast configuration: 1 epoch per round, high GPU utilization

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 00_debug_fast_gpu
  mode: online
  tags: ["00_debug", "fast", "gpu_optimized", "1epoch"]
  notes: "FAST DEBUG: Optimized for A100 with high GPU utilization"
  group: "debug_experiments"

multiround:
  num_rounds: 2                 # Keep 2 rounds to test round transition
  epochs_per_round: 1           # REDUCED: 1 epoch for ultra-fast debugging
  update_reference: true        
  eval_temperature: 0.5
  final_eval_temperature: 0.5   # Skip dual temperature to save time
  n_samples_eval: 4              # REDUCED: Minimal samples for speed
  n_samples_final_eval: 8        # REDUCED: From 64 to 8 for speed
  save_eval_data: true
  
  # Skip pass@k on round 1 to save time (override passk_rounds)
  skip_intermediate_passk: true  # Only do pass@k on final round
  
  # Use subset of data for faster iteration
  use_data_subset: true
  data_subset_ratio: 0.25       # Use only 25% of training data
  
  # Dynamic pairs config remains same
  dynamic_pairs: true
  pair_configs:
    rounds_1_2: 
      margin_type: "25"
      description: "Margin 25 for debug rounds"
      pairs:
        train: data/pairs_margin25/by_das/clean/train.clean.jsonl
        val: data/pairs_margin25/by_das/clean/val.clean.jsonl
        test: data/pairs_margin25/by_das/clean/test.clean.jsonl

paths:
  pair_margin: "25"
  save_dir: multiround/runs/00_debug_fast_gpu
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  base_checkpoint: checkpoints/gRNAde_ARv1_1state_das.h5
  
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl
  
  pairs_margin25:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl
  pairs_margin125:
    train: data/pairs_margin125/by_das/clean/train.clean.jsonl
    val: data/pairs_margin125/by_das/clean/val.clean.jsonl
    test: data/pairs_margin125/by_das/clean/test.clean.jsonl

dpo:
  beta: 0.13
  sft_lambda: 0.10
  label_smoothing: 0.0
  max_len: 512

# GPU OPTIMIZATION: Larger batch size for A100
training:
  epochs: 1                     # Matched to epochs_per_round
  batch_size: 64                # INCREASED: A100 can handle much larger batches
  grad_accum_steps: 1           # REDUCED: No need for accumulation with large batch
  num_workers: 16               # INCREASED: More workers for faster data loading
  precision: bf16               
  pin_memory: false             # Keep false as requested
  drop_last: false              
  log_every: 10                 # REDUCED: Less frequent logging
  save_every: 200               # INCREASED: Less frequent saves
  val_every: 200                # INCREASED: Less frequent validation
  keep_last_n: 2                # REDUCED: Keep fewer checkpoints
  compile: false                # Could enable for speed but keeping false for debug
  
  # Additional optimizations
  prefetch_factor: 4            # Prefetch more batches
  persistent_workers: true      # Keep workers alive between epochs

# SPEED OPTIMIZATION: Reduce expensive evaluations
eval:
  batch_size: 64                # INCREASED: Faster evaluation
  num_workers: 16               # INCREASED: More workers
  pin_memory: false
  
  n_samples: 4                  # REDUCED: Minimal samples
  temperature: 0.5
  
  use_relax: false              
  use_lddt: false               # DISABLED: Skip expensive lDDT
  
  # Only essential metrics for debug
  metrics:
    - recovery                  # Fast
    - perplexity               # Fast
    - sc_eternafold            # Relatively fast
    # - sc_rhofold             # SKIP: Very expensive
    # - vienna_mfe             # SKIP: Can be slow
    # - vienna_ED              # SKIP: Can be slow
    # - diversity_3mer         # SKIP: Not critical for debug
  
  save_designs: false          # DISABLED: Skip saving designs for speed

# Faster evaluation settings
evaluation:
  # Reduce pass@k analysis for speed
  pass_k:
    k_values: [1, 4, 8]        # REDUCED: Fewer k values
    thresholds:
      tm_score: [0.45]         # REDUCED: Single threshold
      rmsd: [8.0]              # REDUCED: Single threshold
      mfe: [-10.0]             # REDUCED: Single threshold
  
  # Skip visualization for speed
  plot_distributions: false
  plot_round_progression: false
  save_sample_sequences: false

featurizer:
  split: train
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.1
  distance_eps: 0.001
  device: cuda                 # CHANGED: Use GPU for featurizer too

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim: [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim: [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

optimizer:
  lr: 0.00018
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip_norm: 1.0

scheduler:
  name: cosine
  warmup_steps: 50              # REDUCED: Faster warmup
  min_lr_ratio: 0.1

# Data validation - skip for speed
validation:
  check_pair_files: false       # DISABLED: Skip validation for speed
  fallback_to_static: true
  static_fallback_margin: "125"
  enable_data_validation: false # DISABLED: Skip for speed

# Command to run:
# python -m multiround.train --config multiround/config/experiments/00_debug_fast_gpu.yaml