# 00. DEBUG A100 80GB - FAST Configuration
# Optimized for rapid iteration with minimal evaluation time
# Skips pass@k on intermediate rounds for faster training

inherit_from: multiround/config/experiments/00_debug_a100_80g_verified.yaml

wandb:
  run_name: 00_debug_a100_80g_fast
  tags: ["00_debug", "a100_80g", "gpu_optimized", "fast", "verified"]
  notes: "DEBUG: Fast A100 config - skips intermediate pass@k for speed"

multiround:
  # Enable fast training mode
  skip_intermediate_passk: true  # Only do pass@k on final round (saves ~20 min/round)
  
  # Optional: Use fewer final eval samples for even faster training
  n_samples_final_eval: 32      # Reduced from 64 to 32 for speed

paths:
  save_dir: multiround/runs/00_debug_a100_80g_fast

# Commands:
# export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
# python -m multiround.train --config multiround/config/experiments/00_debug_a100_80g_fast.yaml