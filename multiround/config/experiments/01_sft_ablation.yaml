# 01. SFT-only Ablation (β=0, λ=0.10, 1 round)
# Baseline for comparison with DPO+SFT methods

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: dpo  # Keep DPO structure but β=0

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: minghao-sun-soc
  run_name: 01_sft_b0_l010
  mode: online
  tags: ["01_sft", "ablation", "baseline"]
  notes: "SFT-only baseline (β=0, λ=0.10) vs DPO+SFT"
  group: "core_experiments"

multiround:
  num_rounds: 1
  epochs_per_round: 20
  update_reference: false
  eval_temperature: 0.5
  final_eval_temperature: 0.1
  n_samples_eval: 8
  n_samples_final_eval: 64
  save_eval_data: true

# Experiment-specific paths
paths:
  pair_margin: "25"
  save_dir: multiround/runs/01_sft_ablation
  # Override default pairs to use margin25
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl

dpo:
  beta: 0.0                    # No DPO loss
  sft_lambda: 0.10             # SFT only
  label_smoothing: 0.0

# Override training epochs to match epochs_per_round
training:
  epochs: 20  # Matched to epochs_per_round

# Override optimizer learning rate  
optimizer:
  lr: 0.00018  # 1.8e-4 optimized for DPO