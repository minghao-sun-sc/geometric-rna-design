# 05. SimPO with Margin 25 (0.25*std preference pairs)
# SimPO alternative to DPO using 0.25*std preference margins

inherit_from: multiround/config/multiround_defaults.yaml

seed: 42
device: cuda
loss_type: simpo

wandb:
  enable: true
  project: MultiRound-DPO-RNA
  entity: <wandb-entity>
  run_name: 05_simpo_m25_b20_g065
  mode: online
  tags: ["05_simpo", "margin25", "baseline"]
  notes: "SimPO with 0.25*std preference margins vs DPO comparison"
  group: "core_experiments"

multiround:
  num_rounds: 5
  epochs_per_round: 20
  update_reference: true
  eval_temperature: 0.5
  final_eval_temperature: 0.1
  n_samples_eval: 8
  n_samples_final_eval: 64
  save_eval_data: true

# Experiment-specific paths
paths:
  pair_margin: "25"
  save_dir: multiround/runs/05_simpo_m25
  # Override default pairs to use margin25
  pairs:
    train: data/pairs_margin25/by_das/clean/train.clean.jsonl
    val: data/pairs_margin25/by_das/clean/val.clean.jsonl
    test: data/pairs_margin25/by_das/clean/test.clean.jsonl

# SimPO-specific parameters
simpo:
  beta: 2.0                    # SimPO beta parameter
  gamma: 0.65                  # SimPO margin parameter
  label_smoothing: 0.0

dpo:
  sft_lambda: 0.01             # Reduced SFT for SimPO

# Override training epochs to match epochs_per_round
training:
  epochs: 20  # Matched to epochs_per_round

# Override optimizer learning rate for SimPO
optimizer:
  lr: 0.0004  # Higher learning rate for SimPO (4e-4)