# ribopo_v2/config/ribopo_v2_defaults.yaml
# RiboPO v2 Winner-Focused DPO Configuration
# Adapts multiround infrastructure for winner-focused approach with larger candidate pools

# Inherit multiround DPO infrastructure
inherit_from: multiround/config/multiround_defaults.yaml

# RiboPO v2 specific settings
ribopo_v2:
  # Winner-focused approach configuration
  candidate_pool_size: 200               # Sequences per backbone for winner selection
  winner_pool_size: 10                   # Top winners per backbone to select
  temperature_diversity: [0.1, 0.5, 1.0]  # Sampling temperatures for diversity
  
  # Reward formula: S_total = 0.50*TM + 0.30*INF + 0.20*ED
  reward_formula:
    tm_weight: 0.50                     # TM-score weight (structure fidelity)
    inf_weight: 0.30                    # INF_ALL weight (interaction fidelity)
    ed_weight: 0.20                     # ED/L weight (ensemble defect per nucleotide)
  
  # Winner selection gates (loose filters)
  winner_gates:
    tm_min: 0.20                        # Minimum TM-score threshold
    rmsd_max: 12.0                      # Maximum RMSD threshold (Å)
    plddt_downweight: 0.6               # Down-weight if pLDDT < threshold
  
  # Per-backbone normalization settings
  normalization:
    method: "percentile_rank"           # Use percentile ranking per backbone
    target_std: [0.25, 0.35]          # Target standard deviation range
    winsorize: [0.05, 0.95]           # Winsorize outliers at P5-P95
  
  # Best-vs-random pairing strategy
  pairing:
    strategy: "best_vs_random"          # Simple pairing strategy
    negatives_per_winner: 3             # Random negatives per winner
    margin_factor: 0.8                  # Margin = 0.8 * MAD(ΔS_total)
    veto_threshold: 0.75                # Drop if winner >0.75σ worse on TM/INF
  
  # Baseline anchors for diversity
  anchors:
    include_native: true                # Include native sequences
    include_gc_shuffle: true            # Include GC-matched shuffles
    gc_shuffle_count: 2                 # Number of GC shuffles per backbone
  
  # Metrics evaluation settings
  use_real_metrics: false               # Set to true to use real structure prediction and metrics
  metrics_cache_dir: ribopo_v2/cache/metrics  # Directory for caching expensive metric calculations
  use_metrics_cache: true               # Use cached results to speed up evaluation

# Override paths for clean filtered data
paths:
  # Clean filtered dataset paths
  processed_pt: ribopo_v2/data_clean_filtered/processed.pt
  split_pt: ribopo_v2/data_clean_filtered/das_split.pt
  data_root: /mnt/rna01/smh/projects/ribopo/ribopo_v2/data_clean_filtered
  
  # Native sequence paths (for anchors)
  native_sequences:
    train: ribopo_v2/native_seq/train
    val: ribopo_v2/native_seq/val
    test: ribopo_v2/native_seq/test
  
  # Winner and pair output paths
  candidates_dir: ribopo_v2/output/candidates
  winners_file: ribopo_v2/output/winners.csv
  pairs_offline: ribopo_v2/output/pairs_offline.jsonl
  pairs_winners_only: ribopo_v2/output/winners_only.jsonl
  
  # Metric caching
  cache_dir: ribopo_v2/cache/metrics
  
  # RiboPO v2 run output
  save_dir: ribopo_v2/runs

# Enhanced evaluation for winner-focused approach
eval:
  # Large candidate pool evaluation
  n_samples: 200                        # Generate 200 candidates per structure
  temperature: 0.5                      # Primary sampling temperature
  
  # Winner evaluation specific settings
  winner_eval:
    temperatures: [0.1, 0.5, 1.0]      # Multi-temperature evaluation
    save_all_candidates: true           # Save all candidates for analysis
    enable_caching: true                # Enable metric caching
    cache_batch_size: 50                # Process metrics in batches
  
  # Comprehensive metrics for winner selection
  metrics:
    - recovery                          # Sequence recovery
    - perplexity                       # Model confidence
    - sc_rhofold                       # 3D structure (TM, RMSD, pLDDT, INF)
    - vienna_mfe                       # MFE calculation
    - vienna_ED                        # Ensemble defect + Shannon entropy
    - diversity_3mer                   # 3-mer diversity analysis
  
  # Structure prediction settings
  use_relax: false                      # Disable relaxation for speed
  use_lddt: true                        # Enable lDDT calculation
  save_designs: true                    # Save all designs for analysis

# Multiround configuration for progressive training
multiround:
  num_rounds: 5                         # 5 rounds as per action plan
  epochs_per_round: 20                  # 20 epochs per round
  update_reference: true                # Update reference model each round
  
  # Progressive evaluation strategy
  eval_samples: 8                       # Quick evaluation per round
  final_eval_samples: 200               # Full candidate evaluation final round
  eval_temperature: 0.5                 # Standard evaluation temperature
  final_eval_temperature: [0.5, 0.1]   # Multiple temps for final evaluation
  
  # Output and checkpointing
  output_root: ribopo_v2/runs/multiround
  save_round_checkpoints: true
  save_best_only: false

# Winner-focused training progression
training_progression:
  # Phase 1: Candidate Generation Testing (Round 0)
  phase_1:
    description: "Test candidate generation and metric computation"
    candidate_pool_size: 50             # Smaller pool for testing
    eval_only: true                     # No training, just evaluation
  
  # Phase 2: Winner Selection Testing (Round 0)
  phase_2:
    description: "Test winner selection and reward calculation"
    candidate_pool_size: 100            # Medium pool for winner testing
    eval_only: true                     # No training, test winner selection
  
  # Phase 3: SFT Baseline (Round 1)
  phase_3:
    description: "SFT training on winners only"
    loss_type: "sft"                    # Pure SFT loss
    use_winners_only: true              # Train only on winner sequences
  
  # Phase 4: Offline DPO (Rounds 1-3)
  phase_4:
    description: "Offline DPO on best-vs-random pairs"
    loss_type: "dpo"                    # DPO + SFT loss
    use_offline_pairs: true             # Use pre-generated pairs
    
  # Phase 5: Online Refinement (Rounds 4-5)
  phase_5:
    description: "Online DPO with on-policy updates"
    loss_type: "dpo"                    # DPO + SFT loss
    use_online_pairs: true              # Generate on-policy pairs
    online_fraction: 0.3                # 30% on-policy pairs

# Override wandb configuration for RiboPO v2
wandb:
  enable: true
  project: RiboPO-v2
  entity: minghao-sun-soc
  run_name: ribopo_v2_winner_focused
  tags: ["ribopo_v2", "winner_focused", "offline_first"]
  notes: "RiboPO v2 winner-focused DPO with larger candidate pools and best-vs-random pairing"
  group: "ribopo_v2_experiments"

# Data validation for clean filtered dataset
validation:
  check_data_paths: true
  require_clean_dataset: true
  check_length_consistency: true
  fallback_enabled: false               # No fallback - use clean data only