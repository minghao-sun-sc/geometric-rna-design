# 03_multiround_test.yaml
# RiboPO v2 Multi-Round Training Test Configuration
# Tests multi-round training integration with reduced parameters for quick validation

inherit_from: ribopo_v2/config/multiround_training.yaml

# Experiment identification
experiment:
  name: "multiround_test"
  description: "Test RiboPO v2 multi-round training with reduced parameters"
  version: "test"

# Reduced parameters for testing
multiround:
  num_rounds: 3                           # Test with 3 rounds instead of 5
  epochs_per_round: 2                     # Reduced epochs for quick testing
  eval_rounds_full: [1, 3]              # Only evaluate rounds 1 and 3
  eval_rounds_quick: [2]                 # Quick eval for round 2

# Reduced training parameters
ribopo_v2_training:
  candidate_pool_size: 50                 # Reduced from 200 for faster testing
  winner_pool_size: 5                     # Reduced from 10
  pairs_per_backbone: 15                  # Reduced from 30

# Faster training configuration
training:
  epochs: 2                               # 2 epochs per round for testing
  batch_size: 8                           # Smaller batch size
  grad_accum_steps: 2                     # Reduced gradient accumulation
  save_every: 20                          # Save more frequently for testing
  val_every: 20                           # Validate more frequently

# Quick evaluation settings
eval:
  n_samples: 4                            # Reduced samples for quick eval
  final_n_samples: 20                     # Reduced final evaluation samples

# Test on subset of data
validation:
  min_winners_total: 10                   # Reduced minimum requirements
  min_pairs_total: 30
  max_training_time_hours: 2              # Shorter time limit for testing

# WandB configuration for testing
wandb:
  run_name: ribopo_v2_multiround_test
  tags: ["ribopo_v2", "multiround", "test", "quick"]
  notes: "Quick test of RiboPO v2 multi-round training integration"

# Debug settings for testing
debug:
  validate_pairs: true
  save_intermediate: true
  profile_performance: false              # Disable profiling for speed
  log_winner_stats: true

# Device and reproducibility settings
seed: 42
device: cuda