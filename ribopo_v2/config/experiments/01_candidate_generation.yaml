# 01_candidate_generation.yaml
# RiboPO v2 Phase 1: Test candidate generation and metric computation
# Validates 200-500 candidate generation pipeline with comprehensive metrics

inherit_from: ribopo_v2/config/ribopo_v2_defaults.yaml

# Experiment identification
experiment:
  name: "candidate_generation_test"
  phase: 1
  description: "Test large-scale candidate generation with metric computation and caching"

# Device and reproducibility
seed: 42
device: cuda

# Override for candidate generation testing
ribopo_v2:
  candidate_pool_size: 200              # Test with 200 candidates per backbone
  temperature_diversity: [0.1, 0.5, 1.0]  # Full temperature diversity
  
  # Enable all anchors for diversity testing
  anchors:
    include_native: true
    include_gc_shuffle: true
    gc_shuffle_count: 3                 # 3 GC shuffles for testing

# Evaluation-only mode (no training)
mode: "evaluation_only"

# Enhanced evaluation configuration
eval:
  # Large candidate pool settings
  n_samples: 200                        # Generate 200 candidates per structure
  temperature: 0.5                      # Primary temperature
  
  # Multi-temperature evaluation
  multi_temperature_eval: true
  temperatures: [0.1, 0.5, 1.0]        # Test all sampling temperatures
  samples_per_temperature: 67          # ~67 samples per temp (200/3)
  
  # Comprehensive metrics for testing
  metrics:
    - recovery                          # Sequence recovery
    - perplexity                       # Model confidence  
    - sc_rhofold                       # Full 3D analysis (TM, RMSD, pLDDT, INF, clash, lDDT, MCQ)
    - vienna_mfe                       # MFE calculation
    - vienna_ED                        # Ensemble defect + entropy + diversity + Tm
    - diversity_3mer                   # 3-mer correlation analysis
  
  # Caching and performance settings
  enable_caching: true
  cache_batch_size: 25                  # Process 25 sequences at a time
  save_designs: true                    # Save all candidates for analysis
  save_intermediate_results: true       # Save per-sample metrics
  
  # Quality control
  deduplicate: true                     # Remove duplicate sequences
  log_diversity: true                   # Log 3-mer diversity metrics

# Paths specific to candidate generation testing
paths:
  save_dir: ribopo_v2/runs/01_candidate_generation
  candidates_dir: ribopo_v2/output/candidates/phase1
  cache_dir: ribopo_v2/cache/metrics/phase1
  
  # Output files for testing
  candidates_file: ribopo_v2/output/candidates_phase1.jsonl
  metrics_file: ribopo_v2/output/metrics_phase1.json
  diversity_file: ribopo_v2/output/diversity_phase1.json
  summary_file: ribopo_v2/output/summary_phase1.json

# Testing configuration
testing:
  # Start with subset for validation
  limit_backbones: 10                   # Test on 10 backbones first
  use_test_set: true                    # Use test set for validation
  
  # Success criteria for phase 1
  success_criteria:
    unique_sequences_pct: 95            # >95% unique sequences
    three_mer_diversity: 0.5            # >0.5 3-mer diversity
    coverage_pct: 100                   # 100% backbone coverage
    cache_hit_rate: 90                  # >90% cache hit rate on re-runs
    
  # Performance targets
  performance_targets:
    time_per_backbone: 300              # <5 minutes per backbone
    memory_usage_gb: 32                 # <32GB memory usage
    disk_usage_gb: 10                   # <10GB disk usage for 10 backbones

# Logging and monitoring
wandb:
  enable: true
  project: RiboPO-v2-Testing
  entity: minghao-sun-soc
  run_name: 01_candidate_generation_test
  tags: ["phase1", "candidate_generation", "testing", "200_candidates"]
  notes: "Phase 1: Test 200-candidate generation with comprehensive metrics and caching"
  group: "ribopo_v2_phase1"

# Debug and validation settings
debug:
  save_sample_outputs: true             # Save sample candidates for inspection
  validate_metrics: true               # Validate metric calculations
  profile_performance: true            # Profile memory and time usage
  log_detailed_stats: true             # Log detailed diversity statistics

# Expected outputs for validation
expected_outputs:
  candidates_per_backbone: 200          # Should generate 200 candidates
  unique_rate_min: 0.95                # Minimum uniqueness rate
  three_mer_diversity_min: 0.5         # Minimum 3-mer diversity
  tm_score_range: [0.0, 1.0]          # Expected TM-score range
  rmsd_range: [0.0, 50.0]             # Expected RMSD range (Å)
  mfe_range: [-100.0, 0.0]            # Expected MFE range (kcal/mol)