# 03_offline_sft.yaml
# RiboPO v2 Phase 3: SFT baseline training on winners only
# Establishes baseline performance using supervised fine-tuning on winner sequences

inherit_from: ribopo_v2/config/ribopo_v2_defaults.yaml

# Experiment identification
experiment:
  name: "offline_sft_baseline"
  phase: 3
  description: "SFT baseline training on winner sequences only with KL regularization"

# Device and reproducibility
seed: 42
device: cuda
loss_type: sft                          # Pure SFT loss

# SFT-specific configuration
sft:
  kl_regularization: 0.10               # KL divergence regularization
  entropy_regularization: 0.05          # Entropy regularization
  label_smoothing: 0.0                  # No label smoothing
  use_winners_only: true                # Train only on winner sequences

# Training configuration for SFT baseline
training:
  epochs: 20                            # 20 epochs for SFT baseline
  batch_size: 16                        # Standard batch size
  grad_accum_steps: 4                   # Gradient accumulation
  precision: bf16                       # Mixed precision
  
  # Learning rate and optimization
  optimizer:
    name: adamw
    lr: 1.5e-4                         # Slightly lower LR for SFT
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
    grad_clip_norm: 1.0
  
  # Scheduler for SFT
  scheduler:
    name: cosine
    warmup_steps: 500                   # Shorter warmup for SFT
    min_lr_ratio: 0.1

# Data configuration for SFT baseline
data:
  # Use winners-only dataset
  use_winners_only: true                # Train on winner sequences
  winner_selection_strategy: "s_total"  # Use S_total ranking
  
  # SFT data preparation
  prepare_sft_data: true                # Enable SFT data preparation
  include_native: true                  # Include native sequences
  balance_dataset: true                 # Balance winners across backbones
  
  # Data augmentation for SFT
  augmentation:
    enable: false                       # No augmentation for baseline
    temperature_sampling: false         # No temperature variation

# Evaluation configuration for SFT
eval:
  # Standard evaluation for SFT baseline
  n_samples: 64                         # Generate 64 samples for evaluation
  temperature: 0.5                      # Standard temperature
  
  # SFT-specific evaluation
  sft_eval:
    eval_on_winners: true              # Evaluate on winner sequences
    compute_likelihood: true           # Compute winner likelihood
    compare_to_native: true            # Compare to native sequences
  
  # Metrics for SFT baseline
  metrics:
    - recovery                          # Sequence recovery
    - perplexity                       # Model perplexity
    - sc_rhofold                       # 3D structure metrics
    - vienna_mfe                       # Thermodynamic metrics
    - vienna_ED                        # Ensemble metrics
    - diversity_3mer                   # Diversity metrics
  
  # Evaluation frequency
  eval_every: 100                       # Evaluate every 100 steps
  save_designs: true                    # Save designed sequences

# Paths for SFT baseline
paths:
  save_dir: ribopo_v2/runs/03_offline_sft
  winners_dataset: ribopo_v2/output/winners_only.jsonl
  sft_checkpoint_dir: ribopo_v2/checkpoints/sft_baseline
  
  # Output paths
  sft_results: ribopo_v2/results/sft_baseline.json
  sft_sequences: ribopo_v2/results/sft_sequences.fasta
  sft_metrics: ribopo_v2/results/sft_metrics.csv

# SFT baseline specific settings
sft_baseline:
  # Loss configuration
  loss_components:
    cross_entropy: 1.0                  # Primary CE loss weight
    kl_divergence: 0.10                 # KL regularization weight
    entropy_bonus: 0.05                 # Entropy bonus weight
  
  # Training strategy
  training_strategy:
    focus_on_winners: true              # Focus on winner sequences
    winner_weighting: true              # Weight winners by S_total
    progressive_difficulty: false       # No curriculum for baseline
  
  # Validation strategy
  validation:
    validate_on_holdout: true          # Use validation winners
    early_stopping: true               # Enable early stopping
    patience: 5                        # Early stopping patience
    metric: "recovery"                  # Early stopping metric

# Checkpointing for SFT
checkpoints:
  save_frequency: 50                    # Save every 50 steps
  keep_best_n: 3                       # Keep top 3 checkpoints
  metric_for_best: "recovery"          # Best checkpoint metric
  save_final: true                     # Save final checkpoint

# Logging and monitoring
wandb:
  enable: true
  project: RiboPO-v2-Training
  entity: minghao-sun-soc
  run_name: 03_offline_sft_baseline
  tags: ["phase3", "sft_baseline", "winners_only", "offline"]
  notes: "Phase 3: SFT baseline training on winner sequences with KL regularization"
  group: "ribopo_v2_training"

# Success criteria for SFT baseline
success_criteria:
  # Training metrics
  final_loss_max: 2.0                   # Training loss should be < 2.0
  recovery_min: 0.6                     # Recovery should be > 0.6
  perplexity_max: 3.0                  # Perplexity should be < 3.0
  
  # Validation metrics
  val_recovery_min: 0.55               # Validation recovery > 0.55
  val_tm_mean_min: 0.30                # Mean TM-score > 0.30
  overfitting_check: true              # Check for overfitting
  
  # Comparison to baseline
  improvement_over_base: true          # Should improve over base model

# Hyperparameter tuning options
hyperparameter_tuning:
  enable: false                        # Disable for baseline
  parameters: []                       # No tuning for baseline

# Debug and analysis settings
debug:
  save_training_curves: true          # Save loss curves
  analyze_winner_distribution: true   # Analyze winner sequence distribution
  compare_to_random: true             # Compare to random sampling
  validate_data_quality: true        # Validate training data quality