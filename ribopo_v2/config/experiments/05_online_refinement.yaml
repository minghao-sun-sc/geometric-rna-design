# 05_online_refinement.yaml
# RiboPO v2 Phase 5: Online DPO refinement with on-policy updates
# Advanced online training with fresh winner updates and mixed on/off-policy pairs

inherit_from: ribopo_v2/config/ribopo_v2_defaults.yaml

# Experiment identification
experiment:
  name: "online_dpo_refinement"
  phase: 5
  description: "Online DPO refinement with on-policy updates and winner refreshing"

# Device and reproducibility
seed: 42
device: cuda
loss_type: dpo                          # DPO + SFT combined loss

# Online DPO configuration
dpo:
  beta: 0.13                           # DPO temperature parameter
  sft_lambda: 0.10                     # SFT regularization weight
  label_smoothing: 0.0                 # No label smoothing

# Online refinement configuration
online_refinement:
  # Round progression
  num_rounds: 2                        # 2 rounds of online refinement
  epochs_per_round: 15                 # Fewer epochs due to online updates
  
  # On-policy sampling
  on_policy_sampling:
    enable: true                       # Enable on-policy sampling
    samples_per_backbone: 20           # Small on-policy pool per backbone
    temperature: 0.5                   # On-policy sampling temperature
    frequency: "every_round"           # Refresh every round
  
  # Winner refreshing strategy
  winner_refresh:
    enable: true                       # Enable winner refreshing
    strategy: "strict_improvement"     # Only replace if strictly better
    refresh_frequency: "every_round"   # Refresh winners every round
    improvement_threshold: 0.05        # Minimum S_total improvement
  
  # Mixed training data
  mixed_training:
    on_policy_fraction: 0.3            # 30% on-policy pairs
    off_policy_fraction: 0.7           # 70% offline pairs (replay buffer)
    replay_buffer_size: 10000          # Maintain replay buffer
    buffer_update_strategy: "rolling"   # Rolling window replay buffer

# Preference pair generation for online training
online_pairs:
  # On-policy pair generation
  generation_strategy: "best_vs_random" # Consistent with offline approach
  negatives_per_winner: 3              # 3 negatives per on-policy winner
  
  # Pair quality control
  quality_control:
    margin_threshold: 0.1              # Minimum margin for on-policy pairs
    consistency_check: true            # Check consistency with offline pairs
    filter_low_confidence: true        # Filter low-confidence pairs
  
  # Dynamic margin calculation
  margin_calculation:
    method: "adaptive"                 # Adaptive margin based on round
    base_factor: 0.8                   # Base margin factor
    improvement_factor: 1.2            # Increase factor for later rounds

# Training configuration for online DPO
training:
  epochs: 15                           # Fewer epochs for online training
  batch_size: 16                       # Standard batch size
  grad_accum_steps: 4                  # Gradient accumulation
  precision: bf16                      # Mixed precision
  
  # Online training specific settings
  online_training:
    data_refresh_frequency: 5          # Refresh training data every 5 epochs
    validate_on_policy: true           # Validate on-policy samples
    monitor_distribution_shift: true   # Monitor policy distribution shift
  
  # Optimizer (slightly lower LR for stability)
  optimizer:
    name: adamw
    lr: 1.5e-4                        # Slightly lower for online stability
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
    grad_clip_norm: 1.0

# Reference model management for online training
reference_model:
  update_strategy: "ema"              # Use EMA for online stability
  ema_decay: 0.995                    # EMA decay factor
  update_frequency: "every_epoch"     # Update EMA every epoch
  
  # Fallback to cloning if needed
  fallback_to_clone: true             # Fallback to clone strategy
  clone_frequency: "every_round"      # Clone at round boundaries

# Evaluation for online refinement
eval:
  n_samples: 100                       # Evaluation samples
  temperature: 0.5                     # Evaluation temperature
  
  # Online-specific evaluation
  online_eval:
    eval_on_policy: true               # Evaluate on-policy samples
    compare_to_offline: true           # Compare to offline DPO
    track_policy_shift: true           # Track policy distribution changes
    measure_exploration: true          # Measure exploration vs exploitation
  
  # Comprehensive metrics
  metrics:
    - recovery                          # Sequence recovery
    - perplexity                       # Model confidence
    - sc_rhofold                       # 3D structure metrics
    - vienna_mfe                       # Thermodynamic metrics
    - vienna_ED                        # Ensemble metrics
    - diversity_3mer                   # Diversity analysis
  
  # Final evaluation settings
  final_eval:
    n_samples: 200                     # Large sample for final evaluation
    temperatures: [0.5, 0.1]          # Multiple temperatures
    comprehensive_metrics: true        # Full metric suite

# Paths for online refinement
paths:
  save_dir: ribopo_v2/runs/05_online_refinement
  checkpoint_dir: ribopo_v2/checkpoints/online_refinement
  
  # Input from offline training
  offline_checkpoint: ribopo_v2/checkpoints/offline_dpo/best.pt
  offline_pairs: ribopo_v2/output/pairs_offline.jsonl
  
  # Online generated data
  on_policy_candidates: ribopo_v2/output/on_policy_candidates.jsonl
  refreshed_winners: ribopo_v2/output/refreshed_winners.csv
  on_policy_pairs: ribopo_v2/output/on_policy_pairs.jsonl
  mixed_pairs: ribopo_v2/output/mixed_pairs.jsonl
  
  # Results
  online_results: ribopo_v2/results/online_refinement_results.json
  policy_evolution: ribopo_v2/results/policy_evolution.json
  final_evaluation: ribopo_v2/results/final_evaluation.json

# Online training strategy
online_strategy:
  # Progressive difficulty
  progressive_updates: true            # Gradually increase on-policy fraction
  round_1_fraction: 0.2               # 20% on-policy in round 1
  round_2_fraction: 0.3               # 30% on-policy in round 2
  
  # Stability measures
  stability_monitoring:
    kl_divergence_limit: 2.0          # Limit KL divergence from reference
    gradient_norm_limit: 5.0          # Gradient norm clipping
    loss_spike_detection: true        # Detect and handle loss spikes
  
  # Quality gates
  quality_gates:
    min_on_policy_quality: 0.4        # Minimum S_total for on-policy winners
    consistency_threshold: 0.8        # Consistency with offline preferences
    exploration_bonus: 0.1            # Bonus for diverse sequences

# Success criteria for online refinement
success_criteria:
  # Performance improvement
  tm_improvement_over_offline: 0.02   # TM improvement > 0.02 over offline
  winner_quality_maintenance: true    # Maintain winner quality standards
  
  # Policy learning
  on_policy_preference_accuracy: 0.7  # On-policy preference accuracy > 70%
  policy_improvement_consistency: true # Consistent improvement direction
  
  # Stability
  training_stability: true            # Stable training without collapse
  no_catastrophic_forgetting: true    # No major performance regression
  reasonable_exploration: true        # Balanced exploration/exploitation

# Logging and monitoring
wandb:
  enable: true
  project: RiboPO-v2-Training
  entity: minghao-sun-soc
  run_name: 05_online_refinement
  tags: ["phase5", "online_dpo", "on_policy", "refinement"]
  notes: "Phase 5: Online DPO refinement with on-policy updates and winner refreshing"
  group: "ribopo_v2_training"

# Advanced monitoring for online training
monitoring:
  # Policy evolution tracking
  track_policy_evolution: true        # Track how policy evolves
  save_policy_snapshots: true         # Save policy at key points
  
  # On-policy analysis
  analyze_on_policy_quality: true     # Analyze on-policy sample quality
  compare_on_off_policy: true         # Compare on vs off-policy samples
  
  # Winner evolution
  track_winner_evolution: true        # Track how winners change
  analyze_winner_replacement: true    # Analyze winner replacement patterns
  
  # Exploration analysis
  measure_sequence_diversity: true     # Measure exploration diversity
  track_novelty: true                 # Track sequence novelty over time

# Debug and analysis settings
debug:
  save_on_policy_samples: true        # Save on-policy samples for analysis
  validate_winner_refresh: true       # Validate winner refresh logic
  monitor_mixed_training: true        # Monitor mixed training dynamics
  analyze_policy_shift: true          # Analyze policy distribution shift
  save_replay_buffer: true            # Save replay buffer states