checkpoint:
  keep_last_n: 3
  save_best: true
  save_every_round: true
data:
  max_num_conformers: 1
dataset:
  bucket_by_length: true
  cache_features: true
  compute_weights: true
  max_pairs: null
  pairs_file: data/pairs_margin125/dpo_pairs_margin125.json
  shuffle_each_epoch: true
  val_pairs_file: null
device: auto
logging:
  level: INFO
  log_every_n_steps: 10
lora:
  alpha: 16
  dropout: 0.0
  enabled: true
  r: 16
  target_modules:
  - W_out
  - W_v
  - W_e
loss:
  beta: 0.163
  lambda_sft: 0.153
  weight_abcs:
  - 0.7
  - 0.3
  - 0.2
  weight_from_confidence: true
  weight_k: 2.0
  weight_m: 0.5
model:
  checkpoint: checkpoints/gRNAde_ARv1_1state_all.h5
  drop_rate: 0.5
  edge_h_dim:
  - 64
  - 4
  edge_in_dim:
  - 131
  - 3
  node_h_dim:
  - 128
  - 16
  node_in_dim:
  - 15
  - 4
  num_layers: 4
  out_dim: 4
output_dir: runs/offline_dpo
seed: 42
train:
  batch_size: 4
  epochs_per_round: 2
  grad_accum_steps: 4
  grad_clip: 1.0
  lr: 0.0001
  min_lr: 1.0e-06
  num_workers: 4
  optimizer: adamw
  rounds: 3
  scheduler: cosine
  shuffle: true
  warmup_ratio: 0.1
  weight_decay: 0.01
