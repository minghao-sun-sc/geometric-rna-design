# DPO HPO Config 4 - A40 GPU (Low beta region)
# Focus: Conservative preference learning

# Model and architecture (from defaults)
model:
  name: AutoregressiveMultiGNNv1
  # EXACT shapes used by gRNAde checkpoints (see gRNAde.py)
  node_in_dim: [15, 4]
  node_h_dim:  [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim:  [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  # cleaned pairs created by: dpo.scripts.split_and_filter_pairs
  pairs:
    train: data/pairs_margin125/by_das/clean/train.clean.jsonl
    val:   data/pairs_margin125/by_das/clean/val.clean.jsonl
    test:  data/pairs_margin125/by_das/clean/test.clean.jsonl
  base_checkpoint: checkpoints/gRNAde_ARv1_1state_das.h5
  save_dir: runs/hpo

featurizer:
  split: train
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1         # matches the checkpoint family (1-state)
  noise_scale: 0.1
  distance_eps: 0.001
  device: cpu                   # use CPU for featurizer to avoid device mismatch

# Training configuration
training:
  epochs: 2  # Quick HPO trials
  batch_size: 28  # A40 has 48GB memory
  grad_accum_steps: 2
  val_every: 50  # Frequent validation for HPO
  log_every: 10
  save_every: 10000  # Don't save during HPO
  precision: fp16  # A40 works well with fp16
  compile: false
  keep_last_n: 1
  num_workers: 6  # As requested
  pin_memory: false  # For stability
  drop_last: false

# HPO specific
hpo:
  max_steps: 5000  # ~5k steps for quick eval
  search_space:
    # DPO specific - lower beta range
    beta_min: 0.05
    beta_max: 0.15
    sft_lambda_min: 0.0
    sft_lambda_max: 0.15
    lr_min: 0.000005
    lr_max: 0.0001

# Optimizer (will be overridden by HPO)
optimizer:
  name: adamw
  lr: 0.00003  # Default, will be overridden
  betas: [0.9, 0.999]
  eps: 0.00000001
  weight_decay: 0.01
  grad_clip_norm: 1.0

# Scheduler
scheduler:
  name: cosine
  warmup_steps: 200  # May be overridden
  min_lr_ratio: 0.1

# DPO loss config (will be overridden)
dpo:
  beta: 0.1
  sft_lambda: 0.08
  label_smoothing: 0.0
  max_len: 200

# SimPO config (for compatibility)
simpo:
  beta: 1.0
  gamma: 0.5
  sft_lambda: 0.0

# Algorithm selection
loss_type: "dpo"

# Reference model
reference:
  checkpoint_path: null  # Use random init or specify pretrained
  freeze: true

# Wandb
wandb:
  enable: true
  project: "ribopo_hpo"
  run_name: "dpo_hpo_region1"  # Will be overridden
  mode: "online"
  tags: ["dpo", "hpo", "region1", "A40"]

# Device
device: "cuda"
seed: 45