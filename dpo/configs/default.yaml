# dpo/configs/default.yaml
seed: 42
device: "cuda"
gpu: 0

# === Model ===
model:
  _target_: src.models.AutoregressiveMultiGNNv1   # <- correct module path
  node_in_dim: [15, 4]
  node_h_dim:  [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim:  [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

# If you want to load pretrained weights, use ref_ckpt below
model_checkpoint: "checkpoints/gRNAde_ARv1_1state_all.h5"

# If you want to force a separate reference model, add this; otherwise it will clone the policy:
# ref_model:
#   _target_: src.models.AutoregressiveMultiGNNv1
#   (same params as above)
# Or load a checkpoint into the frozen reference:
# ref_ckpt: "/path/to/reference.ckpt"

# === Data ===
data:
  processed_pt: "data/processed.pt"
  split_file:   "data/das_split.pt"
  pairs_path_train: "data/pairs_margin125/split_by_das/train.jsonl"
  pairs_path_val:   "data/pairs_margin125/split_by_das/val.jsonl"
  max_num_conformers: 1
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  noise_scale: 0.1
  use_seq_mask: true
  strict_length_check: false
  window_align: true
  min_window_identity: 0.70

# === Train ===
train:
  batch_size: 16
  grad_accum_steps: 8
  num_workers: 2
  grad_clip: 1.0
  rounds: 2
  epochs_per_round: 10
  val_every_steps: 100
  ckpt_every_steps: 1000
  save_dir: "runs/offline_dpo_full"

# === Optim & Schedules ===
optimizer:                       # <- rename from 'optim' so the module picks it up
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  scheduler: "cosine_wr"
  cosine_t0_steps: 2000
  cosine_tmult: 2

# === Loss ===
loss:
  beta: 0.2
  lambda_sft: 0.05
  length_norm: false

lora:
  enabled: true
  r: 16
  alpha: 32  
  dropout: 0.05
  # Target the actual GVP layer names in the model
  # ws: scalar projection layers (largest params: 18K-82K each)
  # wh: hidden layers, wv: vector layers, wsv: scalar-vector gates
  target_modules: ["ws", "wh", "wv", "wsv"]
  train_bias: "none"

# === Logging ===
logging:
  project: "DPO-RNA"
  # run_name: set via --run_name
  log_grads: false
