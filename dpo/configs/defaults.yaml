# DPO-RNA default config (uses filtered, length-consistent pairs)
seed: 0
device: cuda

wandb:
  enable: true
  project: DPO-RNA
  entity: null          # <-- set if you want
  run_name: null        # can be overridden via CLI: --run_name <name>
  mode: online          # "offline" if needed
  tags: ["dpo", "rna", "offline", "das"]

paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  # cleaned pairs created by: dpo.scripts.split_and_filter_pairs
  pairs:
    train: data/pairs_margin125/by_das/clean/train.clean.jsonl
    val:   data/pairs_margin125/by_das/clean/val.clean.jsonl
    test:  data/pairs_margin125/by_das/clean/test.clean.jsonl
  base_checkpoint: checkpoints/gRNAde_ARv1_1state_das.h5
  save_dir: runs/offline_dpo

featurizer:
  split: train
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1         # matches the checkpoint family (1-state)
  noise_scale: 0.1
  distance_eps: 0.001
  device: cpu                   # use CPU for featurizer to avoid device mismatch

model:
  name: AutoregressiveMultiGNNv1
  # EXACT shapes used by gRNAde checkpoints (see gRNAde.py)
  node_in_dim: [15, 4]
  node_h_dim:  [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim:  [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

optimizer:
  name: adamw
  lr: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip_norm: 1.0

scheduler:
  name: cosine
  warmup_steps: 1000        # linear warmup steps (global)
  min_lr_ratio: 0.1         # final lr = min_lr_ratio * base lr

training:
  epochs: 20
  batch_size: 1             # model is naturally single-graph; use grad-accum
  grad_accum_steps: 8
  num_workers: 0            # avoid CUDA multiprocessing issues
  pin_memory: true
  drop_last: false
  compile: false
  precision: bf16           # or "fp16" or "fp32"
  log_every: 1              # log every step
  val_every: 100            # validate every 100 steps
  save_every: 100           # save checkpoint every 100 steps
  keep_last_n: 5

dpo:
  beta: 0.1                 # DPO beta
  sft_lambda: 0.1           # mix-in SFT loss on winners
  label_smoothing: 0.0
  max_len: null             # optional truncate length
