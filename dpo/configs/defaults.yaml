# dpo/configs/default.yaml
seed: 42
device: "cuda"
gpu: 0

# === Model ===
# Matches gRNAde ARv1 default dims
model: "ARv1"                                     # ARv1 | NARv1 (stick to ARv1)
model_path: "checkpoints/gRNAde_ARv1_1state_all.h5"
node_in_dim: [15, 4]
node_h_dim:  [128, 16]
edge_in_dim: [131, 3]
edge_h_dim:  [64, 4]
num_layers: 4
drop_rate: 0.5
out_dim: 4

# === Data ===
data:
  processed_pt: "data/processed.pt"
  split_file:   "data/das_split.pt"               # <- use das split
  pairs_path_train: "data/pairs_margin125/train.jsonl"
  pairs_path_val:   "data/pairs_margin125/val.jsonl"
  max_num_conformers: 1
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  noise_scale: 0.1
  use_seq_mask: true                              # if present in JSONL

# === Train ===
train:
  batch_size: 16                                  # micro-batch (per GPU)
  grad_accum_steps: 8                             # -> effective batch 16*8
  num_workers: 4
  grad_clip: 1.0
  rounds: 2
  epochs_per_round: 10                            # 2*10 = 20 total epochs (>=20)
  val_every_steps: 100
  ckpt_every_steps: 1000
  save_dir: "runs/offline_dpo_full"

# === Optim & Schedules ===
optim:
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  # Cosine annealing with warm restarts (as in gRNAde spirit)
  scheduler: "cosine_wr"                          # cosine_wr | none
  cosine_t0_steps: 2000                           # first restart period
  cosine_tmult: 2

# === Loss ===
loss:
  beta: 0.2
  lambda_sft: 0.05
  length_norm: false

# === Logging ===
logging:
  wandb: true
  project: "DPO-RNA"
  run_name: "offline_dpo_das"
  log_grads: false
