seed: 42
device: cuda

paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  split_name: test

  # Test with just one checkpoint
  checkpoints:
    - name: "dpo_v10_step_5k"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/steps/step_0005000.pt

featurizer:
  split: test
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.0
  distance_eps: 0.001
  device: cpu

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim:  [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim:  [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

eval:
  batch_size: 4
  num_workers: 2
  pin_memory: true
  
  # Output directory for test results
  out_dir: dpo/eval_results/test_small_eval
  
  # Minimal sampling for quick test
  n_samples: 2
  temperature: 0.1
  
  # Test basic metrics first, then add comprehensive ones
  metrics:
    - recovery
    - perplexity
    - sc_eternafold
    - vienna_mfe
    - diversity_3mer
  
  # Save designs for debugging
  save_designs: true
  
  # W&B logging configuration
  wandb:
    enable: false