

seed: 42
device: cuda

paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt
  split_name: test

  # Checkpoints to evaluate for v10
  checkpoints:
    - name: "dpo_v10_step_5k"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/steps/step_0005000.pt
    - name: "dpo_v10_step_11.8k"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/steps/step_0011800.pt
    - name: "dpo_v10_step_17.3k"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/steps/step_0017300.pt
    - name: "dpo_v10_step_24.3k"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/steps/step_0024300.pt
    - name: "dpo_v10_step_44.5k"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/steps/step_0044500.pt
    - name: "dpo_v10_step_76.7k"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/steps/step_0076700.pt
    - name: "dpo_v10_step_121.7k"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/steps/step_0121700.pt
    - name: "dpo_v10_best"
      path: runs/offline_dpo/dpo_v10_beta0.10_lambda0.10_1e-4/best.pt

featurizer:
  split: test
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.0
  distance_eps: 0.001
  device: cpu

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim:  [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim:  [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

eval:
  batch_size: 4
  num_workers: 2
  pin_memory: true
  
  # Output directory for comprehensive evaluation results
  out_dir: dpo/eval_results/full_eval_dpo_v10
  
  # Sampling parameters for self-consistency metrics
  n_samples: 8
  temperature: 0.1
  
  # Comprehensive metrics to compute
  metrics:
    # Basic metrics (teacher-forced)
    - recovery                  # Token-level sequence recovery
    - perplexity               # Model confidence/uncertainty
    
    # 2D Self-consistency (secondary structure)
    - sc_eternafold            # EternaFold MCC scores
    
    # 3D Self-consistency (tertiary structure) 
    - sc_rhofold               # RhoFold: RMSD, TM, GDT, pLDDT, INF, clash
    
    # Thermodynamics (ViennaRNA) - use specific metric names
    - vienna_mfe               # Minimum Free Energy
    - vienna_ED                # Ensemble Defect
    
    # Sequence diversity
    - diversity_3mer           # 3-mer correlation with native
  
  # Save designed sequences and intermediate files
  save_designs: true
  
  # W&B logging configuration
  wandb:
    enable: true
    project: DPO-RNA
    entity: minghao-sun-soc
    run_name: full_eval_v10_comprehensive
    tags: 
      - comprehensive_eval
      - dpo_v10
      - all_metrics