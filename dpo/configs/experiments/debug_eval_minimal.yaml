# Minimal debug config - no expensive 3D metrics 
seed: 42 
device: cuda

paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt    
  split_name: test               
  
  # Checkpoints to evaluate
  checkpoints:
    - name: "BASE_gRNAde_1state_das"
      path: checkpoints/gRNAde_ARv1_1state_das.h5

featurizer:
  split: test
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.0
  distance_eps: 0.001
  device: cpu                   

model:
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim:  [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim:  [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

eval:
  batch_size: 16
  num_workers: 6                
  pin_memory: true
  
  out_dir: runs/benchmark_full
  
  # Debug settings
  max_structures: 3             # Only evaluate first 3 structures 
  n_samples: 2                  # Reduce samples for faster testing  
  temperature: 0.5              
  use_relax: false              # Disable relax for faster testing
  
  # Only fast metrics to verify fixes
  metrics:
    - recovery                  
    - perplexity               
    - sc_eternafold            # 2D only - should be fast
    - vienna_mfe               # Fast Vienna metrics only
    - diversity_3mer           # Fast diversity metric
  
  save_designs: false          
  
  wandb:
    enable: true
    project: DPO-RNA
    entity: minghao-sun-soc
    run_name: debug_eval_minimal_fast_metrics
    notes: "Debug evaluation with fast metrics only - no RhoFold"