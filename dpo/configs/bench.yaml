# Evaluate gRNAde-style recovery on DAS split (or any) and compare ckpts.

seed: 0
device: cuda

paths:
  processed_pt: data/processed.pt
  split_pt: data/das_split.pt    # can swap to structsim_v2_split.pt
  # Choose split: train | val | test
  split_name: test

  # Base model checkpoint (.h5) and any number of fine-tuned ckpts (.pt)
  checkpoints:
    - name: "BASE_gRNAde_1state_das"
      path: checkpoints/gRNAde_ARv1_1state_das.h5
    # add fine-tuned ckpts once training completes; can be absolute or under runs/
    # Example DPO checkpoint paths (uncomment and adjust once available):
    # - name: "DPO_v2_best"
    #   path: runs/offline_dpo/dpo_rna_v2/best.pt
    # - name: "DPO_v3_best" 
    #   path: runs/offline_dpo/dpo_rna_v3_test_final/best.pt

featurizer:
  split: test
  radius: 0.0
  top_k: 32
  num_rbf: 32
  num_posenc: 32
  max_num_conformers: 1
  noise_scale: 0.0
  distance_eps: 0.001
  device: cpu                   # use CPU for featurizer to avoid device mismatch

model:
  # EXACT shapes used by gRNAde checkpoints
  name: AutoregressiveMultiGNNv1
  node_in_dim: [15, 4]
  node_h_dim:  [128, 16]
  edge_in_dim: [131, 3]
  edge_h_dim:  [64, 4]
  num_layers: 4
  drop_rate: 0.5
  out_dim: 4

eval:
  batch_size: 1
  num_workers: 0            # avoid CUDA multiprocessing issues
  pin_memory: true

  # where to save a comparison CSV and per-ckpt metrics
  out_dir: runs/benchmark
  out_csv: runs/benchmark/benchmark_summary.csv

  # W&B logging (optional)
  wandb:
    enable: true
    project: DPO-RNA
    entity: null
    run_name: null          # will default to "bench_<split>_<timestamp>"
    tags: ["bench", "gRNAde"]
